name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: routeburn-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Verify application
        run: |
          gofmtcheck=$(gofmt -l .)
          if [ -n "$gofmtcheck" ]; then
            printf 'Unformatted files:\n%s\n' "$gofmtcheck"
            exit 1
          fi
          go vet ./...
          go test -race ./...
          go build ./cmd/routeburn

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Validate release configuration
        env:
          # Defined-but-empty so the tap template resolves during a dry run.
          HOMEBREW_TAP_TOKEN: ""
        run: |
          goreleaser check
          goreleaser release --snapshot --clean
          git diff --exit-code

      - name: Determine version and publish release
        id: semantic
        run: ./node_modules/.bin/semantic-release
        env:
          # The workflow's own token is enough to tag, publish the release and
          # push the formula. The tap push needs HOMEBREW_TAP_TOKEN, which is
          # only set when a tap token secret exists; without it GoReleaser
          # skips the tap upload and the release still succeeds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GIT_AUTHOR_NAME: routeburn-release-bot
          GIT_AUTHOR_EMAIL: routeburn-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: routeburn-release-bot
          GIT_COMMITTER_EMAIL: routeburn-release-bot@users.noreply.github.com

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          {
            echo '### RouteBurn release'
            if [ -n "$VERSION" ]; then
              echo "Published version: v$VERSION"
              echo "Release page: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            else
              echo 'No qualifying commits since the last release; nothing published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-homebrew:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: macos-latest
    env:
      EXPECTED_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Install and test published cask
        run: |
          brew tap acevedomiguel/routeburn
          brew install --cask routeburn
          routeburn --version | grep -F "routeburn version ${EXPECTED_VERSION}"

  verify-archives:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Download a published archive and check its version
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux) asset="routeburn_${VERSION}_linux_amd64.tar.gz"; dir=linux_amd64 ;;
            Windows) asset="routeburn_${VERSION}_windows_amd64.zip"; dir=windows_amd64 ;;
          esac
          url="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          mkdir -p unpacked
          if [ "$RUNNER_OS" = 'Windows' ]; then
            unzip -q "$asset" -d unpacked
            ./unpacked/routeburn.exe --version
            ./unpacked/routeburn.exe --version | grep -q "routeburn version ${VERSION}"
          else
            tar -xzf "$asset" -C unpacked
            ./unpacked/routeburn --version
            ./unpacked/routeburn --version | grep -q "routeburn version ${VERSION}"
          fi
