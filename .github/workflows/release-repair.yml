name: release-repair

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag without the leading v (for example 1.2.3). The tag is never moved.'
        required: true
        type: string
      confirm_republish:
        description: 'Type republish to allow overwriting existing release assets'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: routeburn-release-repair
  cancel-in-progress: false

jobs:
  repair:
    if: inputs.confirm_republish == 'republish'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse versions prefixed with v
        run: |
          case "$VERSION" in
            v*) echo "Pass the version without the v prefix."; exit 1 ;;
            *[!0-9.]*|'') echo "Invalid version: $VERSION"; exit 1 ;;
          esac

      - name: Check out the exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Confirm the checked-out commit matches the tag
        run: |
          tag_commit=$(git rev-list -n 1 "v${VERSION}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo 'Refusing to repair: HEAD does not match the tag.'
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify application
        run: |
          go vet ./...
          go test -race ./...
          go build ./cmd/routeburn

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Validate release configuration
        run: |
          goreleaser check
          goreleaser release --snapshot --clean
          git diff --exit-code

      - name: Create short-lived release token
        id: release-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            routeburn
            homebrew-routeburn
          permission-contents: write

      - name: Republish GoReleaser artifacts for the existing tag
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.release-token.outputs.token }}
        run: goreleaser release --clean --skip=validate

      - name: Job summary
        if: always()
        run: |
          echo "Repair attempted for v${VERSION}. Tags are never moved; publish a corrective patch for real fixes." >> "$GITHUB_STEP_SUMMARY"
