name: Validate project site

on:
  pull_request:
    paths:
      - site/**
      - tests/site/**
      - scripts/build-site-images.mjs
      - scripts/lighthouse-site.mjs
      - package.json
      - package-lock.json
      - playwright.config.js
      - .htmlvalidate.json
      - .github/workflows/site-check.yml
      - .github/workflows/pages.yml

permissions:
  contents: read

jobs:
  site-check:
    name: HTML, links, accessibility, metadata, and performance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run check:html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/js/site.js
          node --check tests/site/serve.mjs
          node --check tests/site/check-links.mjs
          node --check tests/site/site.spec.mjs
          node --check scripts/build-site-images.mjs
          node --check scripts/capture-social-preview.mjs
          node --check scripts/lighthouse-site.mjs

      - name: Check internal links and assets
        run: npm run check:links

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run accessibility, responsive, metadata, and security tests
        run: npm run test:site

      - name: Run Lighthouse smoke check
        run: npm run check:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
